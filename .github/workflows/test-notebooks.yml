name: Test solution notebooks

# Runs every practical from top to bottom with its solutions filled in, using
# the course environment.yml, so a library update that breaks a practical is
# caught before students hit it. The "Check your answer" cells must also pass.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC, to catch breakage from new package releases
    - cron: "0 6 * * 1"

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: DEES_python

      - name: Register kernel
        run: python -m ipykernel install --user --name python3

      - name: Run every practical with its solutions
        # Pastes the code from each "Show solution" dropdown into its exercise
        # cell and runs the notebook. See selfcheck/run_solutions.py.
        run: python selfcheck/run_solutions.py
